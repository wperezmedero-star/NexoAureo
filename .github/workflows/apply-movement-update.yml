name: Apply movement update

on:
  push:
    branches: [integrate-movimiento-claude]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact supplied changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .motion-update.patch
          git apply .motion-update.patch
          echo "9709d11207699bf27bd528eff771bd6987416349d9b30db536aa0947b38fb024  app/page.tsx" | sha256sum -c -
          echo "dd1e3469e5c6aa61fb5404823a6077c5c4fa69bcd53116d188f35f1834bbcab4  app/globals.css" | sha256sum -c -
          echo "56260dcfd66b70f92a1f094717194b46d5a589fce49e63cc283210e4fa5be79d  app/future.css" | sha256sum -c -

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:engine
          npm run test:auth
          npm run build

      - name: Commit clean movement update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .motion-update.patch
          rm -rf .motion-upload
          rm -f .github/workflows/apply-movement-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate NexoAureo movement improvements"
          git push origin HEAD:integrate-movimiento-claude
